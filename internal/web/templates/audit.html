{{template "top" .}}
{{if .Audit}}
<table>
<thead><tr><th>Time</th><th>Event</th><th>Details</th></tr></thead>
<tbody>
{{range .Audit}}<tr><td class="nowrap">{{.Time}}</td><td class="nowrap">{{.Event}}</td><td>{{.Details}}</td></tr>
{{end}}
</tbody>
</table>
{{if .NextBefore}}<p><a href="/audit?before={{.NextBefore}}">Older entries</a></p>{{end}}
{{else}}
<p>No entries.</p>
{{end}}
{{template "bottom" .}}
